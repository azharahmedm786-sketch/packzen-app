name: Deploy to Firebase Hosting

# In PackZen 3.0, automatic deployment on push to main is disabled to resolve P0 Blocker 1:
# Production releases to 'packzen-e7539' require Ed25519 release authorization
# enforced by scripts/guard-staging-deploy.js and orchestrated via scripts/pz-release.js.
# Pushes to main and PRs are fully verified via .github/workflows/tests.yml.
# Deliberate releases must be orchestrated via:
#   node scripts/pz-release.js deploy --only hosting --confirm-production-release=packzen-e7539

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    name: Deploy public/ to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PACKZEN_E7539 }}
          channelId: live
          projectId: packzen-e7539
