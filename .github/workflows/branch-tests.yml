name: Branch Tests

on:
  push:
    branches:
      - firebase-hosting-migration

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run Cloud Functions regression test suite
        working-directory: functions
        run: npm test

      - name: Run 50 pricing scenarios sweep
        run: node tests/test_50_scenarios.js
