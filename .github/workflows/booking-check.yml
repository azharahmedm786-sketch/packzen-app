name: Daily booking check

# A robot "customer" opens packzenblr.in every morning: server health, homepage,
# booking form + Google address search, services catalog, Digital form.
# If anything fails, this run turns red and GitHub e-mails you.
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Run the customer check
        run: node scripts/booking-check.mjs
