name: Deploy PackZen Website

# packzenblr.in is served by GitHub Pages from ./public.
# Any merge to main that changes public/ goes live automatically; you can also
# run it by hand from the Actions tab. Cloud Functions and Firestore rules are
# still deployed separately with `firebase deploy --only functions,firestore`.
on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
