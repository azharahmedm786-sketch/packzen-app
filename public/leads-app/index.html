<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <meta name="robots" content="noindex, nofollow">
  <title>PackZen Leads</title>
  <meta name="theme-color" content="#1F9D5C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="/assets/logo/packzen-logo.png">
  <link rel="apple-touch-icon" href="/assets/logo/newllogo1.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Geist:wght@400..700&display=swap">
  <link rel="stylesheet" href="app.css?v=1">
</head>
<body>
  <div id="login" class="screen login" hidden>
    <div class="login-card">
      <img src="/assets/logo/packzen-logo.png" alt="" width="44" height="44">
      <h1>PackZen Leads</h1>
      <p>Sign in with your PackZen admin account.</p>
      <label>Email<input id="lEmail" type="email" autocomplete="username"></label>
      <label>Password<input id="lPass" type="password" autocomplete="current-password"></label>
      <p id="lErr" class="err" role="alert"></p>
      <button id="lBtn" class="btn">Sign in</button>
    </div>
  </div>

  <div id="app" class="screen" hidden>
    <header class="top">
      <div class="brand"><img src="/assets/logo/packzen-logo.png" alt="" width="28" height="28"> Leads</div>
      <div class="top-r"><span id="liveDot" class="live" title="Live"></span><button id="soundBtn" class="icon-btn" aria-label="Alert sound">🔔</button><button id="outBtn" class="icon-btn" aria-label="Sign out">⎋</button></div>
    </header>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="inbox" role="tab">Inbox</button>
      <button class="tab" data-tab="followups" role="tab">Follow-ups</button>
      <button class="tab" data-tab="report" role="tab">Quality report</button>
    </nav>

    <section id="inbox" class="pane">
      <div class="kpis" id="kpis"></div>
      <div class="filters">
        <div class="seg" id="tierSeg">
          <button data-tier="open" class="on">Open</button><button data-tier="hot">🔥 Hot</button><button data-tier="warm">Warm</button><button data-tier="cold">Cold</button><button data-tier="junk">Junk</button><button data-tier="all">All</button>
        </div>
        <input id="q" placeholder="Search name, phone, area">
      </div>
      <div id="list" class="list"></div>
    </section>

    <section id="followups" class="pane" hidden><div id="fuList" class="list"></div></section>
    <section id="report" class="pane" hidden><div id="rep"></div></section>
  </div>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle"><div class="sheet-card" id="sheetCard"></div></div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="/env-config.js?v=2"></script>
  <script src="/firebase-config.js"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
