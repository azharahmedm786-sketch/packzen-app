<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>PackZen Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>

  <!-- ✅ FIX 1: Block Google from indexing the admin page -->
  <meta name="robots" content="noindex, nofollow, noarchive"/>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js" integrity="sha384-FcQlsUOd0TJjROrBxhJdUhXTUgNJQxTMcxZe6nHbaEfFL1zjQ+bq/uRoBQxb0KMo" crossorigin="anonymous"></script>
  <style>
    :root{--primary:#0057ff;--accent:#00c96e;--dark:#050d1a;--text:#1a2744;--text-muted:#5a6a8a;--surface:#fff;--surface2:#f4f7ff;--border:#dde4f5;--shadow-sm:0 2px 12px rgba(0,60,180,.08);--shadow-md:0 8px 32px rgba(0,60,180,.12)}
    body.dark{--text:#e2e8f4;--text-muted:#8a9bbf;--surface:#0d1f3c;--surface2:#091529;--border:#1e3a5f;--dark:#020810}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:var(--surface2);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
    h1,h2,h3{font-family: 'Space Grotesk',sans-serif}
    .admin-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark)}
    .login-card{background:var(--surface);border-radius:24px;padding:40px 36px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
    .login-logo{font-family: 'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:800;color:var(--primary);margin-bottom:6px}
    .login-sub{color:var(--text-muted);font-size:.9rem;margin-bottom:28px}
    .field-label{display:block;font-size:.85rem;font-weight:600;color:var(--text-muted);margin-bottom:8px;margin-top:16px}
    .field-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-family:'Manrope',sans-serif;font-size:.95rem;color:var(--text);background:var(--surface);outline:none;transition:border-color .2s}
    .field-input:focus{border-color:var(--primary)}
    .btn-auth{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:50px;font-family:'Manrope',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-top:20px;box-shadow:0 6px 20px rgba(0,87,255,.3);transition:transform .2s}
    .btn-auth:hover{transform:translateY(-2px)}
    .btn-auth:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .auth-err{font-size:.85rem;color:#e53e3e;margin-top:10px;min-height:18px}
    .lockout-banner{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);border-radius:10px;padding:10px 14px;font-size:.84rem;color:#dc2626;margin-top:12px;display:none}

    /* ✅ FIX 2: Shell is NOT in the DOM at load — injected only after auth passes */
    .admin-shell{display:none}
    .admin-shell.active{display:flex;min-height:100vh}
    .sidebar{width:240px;background:var(--dark);display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
    .sidebar-logo{padding:0 24px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
    .sidebar-logo span{font-family: 'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:800;color:#fff}
    .sidebar-logo b{color:var(--accent)}
    .sb-role{font-size:.7rem;color:rgba(255,255,255,.4);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 24px;margin:10px 0 5px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:11px 24px;color:rgba(255,255,255,.6);font-size:.88rem;font-weight:500;cursor:pointer;transition:background .2s,color .2s;border-left:3px solid transparent}
    .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
    .nav-item.active{background:rgba(0,87,255,.15);color:#fff;border-left-color:var(--primary)}
    .nav-item .ni{font-size:1rem;width:20px;text-align:center}
    .sidebar-bottom{margin-top:auto;padding:16px 24px;border-top:1px solid rgba(255,255,255,.08)}
    .btn-signout{width:100%;padding:10px;background:rgba(255,255,255,.08);border:none;border-radius:10px;color:rgba(255,255,255,.7);font-family:'Manrope',sans-serif;font-size:.85rem;cursor:pointer;transition:background .2s}
    .btn-signout:hover{background:rgba(255,80,80,.2);color:#fff}
    .admin-main{margin-left:240px;flex:1;padding:28px;min-height:100vh;background:var(--surface2);transition:background .3s}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .topbar h1{font-size:1.5rem;font-weight:800;color:var(--text)}
    .topbar-right{display:flex;align-items:center;gap:10px}
    .theme-btn{background:var(--surface);border:1.5px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:transform .3s}
    .theme-btn:hover{transform:rotate(20deg)}
    .admin-badge{background:rgba(0,87,255,.1);color:var(--primary);font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid rgba(0,87,255,.2)}
    /* <i data-lucide="check-circle"></i> FIX 3: Session timer display */
    .session-timer{font-size:.75rem;color:var(--text-muted);padding:4px 10px;border:1px solid var(--border);border-radius:20px;}
    .session-timer.warn{color:#d97706;border-color:#d97706}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
    .stat-card{background:var(--surface);border-radius:16px;padding:18px 20px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
    .sc-lbl{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-bottom:5px}
    .sc-val{font-family: 'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:800;color:var(--primary)}
    .sc-sub{font-size:.73rem;color:var(--text-muted);margin-top:3px}
    .section{display:none}
    .section.active{display:block}
    .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
    .chart-card{background:var(--surface);border-radius:18px;border:1px solid var(--border);padding:20px 22px;box-shadow:var(--shadow-sm)}
    .chart-card h3{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:16px}
    .table-title{font-family: 'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;color:var(--text)}
    .table-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .search-input{padding:7px 14px;border:1.5px solid var(--border);border-radius:30px;font-family:'Manrope',sans-serif;font-size:.83rem;background:var(--surface2);color:var(--text);outline:none;width:170px}
    table{width:100%;border-collapse:collapse}
    th{background:var(--surface2);padding:10px 14px;text-align:left;font-size:.76rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
    td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:.84rem;color:var(--text);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(0,87,255,.02)}
    .empty-row td{text-align:center;color:var(--text-muted);padding:36px;font-size:.88rem}
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
    .badge-pending{background:rgba(251,191,36,.15);color:#d97706}
    .badge-confirmed{background:rgba(0,87,255,.12);color:var(--primary)}
    .badge-assigned{background:rgba(124,58,237,.12);color:#7c3aed}
    .badge-packing{background:rgba(14,165,233,.12);color:#0ea5e9}
    .badge-transit{background:rgba(249,115,22,.12);color:#f97316}
    .badge-delivered{background:rgba(0,201,110,.12);color:var(--accent)}
    .btn-sm{padding:5px 12px;border-radius:18px;border:none;font-family:'Manrope',sans-serif;font-size:.76rem;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-assign{background:rgba(0,87,255,.1);color:var(--primary)}
    .btn-assign:hover{background:var(--primary);color:#fff}
    .btn-export{background:rgba(0,201,110,.1);color:var(--accent);border:1.5px solid rgba(0,201,110,.3);padding:7px 14px;border-radius:30px;font-family:'Manrope',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:background .2s}
    .btn-export:hover{background:var(--accent);color:#fff}
    .btn-primary-sm{background:var(--primary);color:#fff;padding:7px 16px;border:none;border-radius:30px;font-family:'Manrope',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:background .2s}
    .btn-primary-sm:hover{background:#0040cc}
    select.status-sel{padding:4px 10px;border:1.5px solid var(--border);border-radius:18px;font-family:'Manrope',sans-serif;font-size:.76rem;font-weight:600;background:var(--surface2);color:var(--text);cursor:pointer;outline:none}
    .driver-card{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow-sm);margin-bottom:14px}
    .driver-info{display:flex;align-items:center;gap:14px}
    .driver-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;font-family: 'Space Grotesk',sans-serif;flex-shrink:0}
    .driver-name{font-weight:700;color:var(--text);font-size:.95rem}
    .driver-meta{font-size:.8rem;color:var(--text-muted);margin-top:2px}
    .online-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
    .online-dot.on{background:var(--accent);box-shadow:0 0 5px rgba(0,201,110,.6)}
    .online-dot.off{background:var(--text-muted)}
    .assign-overlay{position:fixed;inset:0;background:rgba(5,13,26,.75);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
    .assign-box{background:var(--surface);border-radius:20px;padding:32px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
    .assign-title{font-family: 'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:800;color:var(--text);margin-bottom:16px}
    .assign-info{background:var(--surface2);border-radius:12px;padding:14px;border:1px solid var(--border);font-size:.86rem;color:var(--text);line-height:1.8;margin-bottom:16px}
    .btn-row{display:flex;gap:10px;margin-top:18px}
    .btn-cancel{flex:1;padding:11px;background:var(--surface2);color:var(--text-muted);border:1.5px solid var(--border);border-radius:50px;font-family:'Manrope',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer}
    .btn-confirm{flex:2;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:50px;font-family:'Manrope',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(0,87,255,.3)}
    .promo-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    .promo-form input,.promo-form select{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Manrope',sans-serif;font-size:.88rem;background:var(--surface2);color:var(--text);outline:none}
    .promo-form input:focus,.promo-form select:focus{border-color:var(--primary)}
    .bulk-textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;font-family:'Manrope',sans-serif;font-size:.9rem;color:var(--text);background:var(--surface2);outline:none;resize:vertical;min-height:80px;margin-bottom:10px}
    .bulk-textarea:focus{border-color:var(--primary)}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:12px 24px;border-radius:50px;font-size:.9rem;font-weight:600;z-index:99999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .driver-form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
    .driver-form-grid input,.driver-form-grid select{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Manrope',sans-serif;font-size:.88rem;background:var(--surface2);color:var(--text);outline:none;width:100%}
    .driver-form-grid input:focus,.driver-form-grid select:focus{border-color:var(--primary)}
    .driver-form-actions{display:flex;align-items:flex-end}
    #adminDriverMsg{min-height:18px;font-size:.83rem;margin-top:6px;font-weight:600}
    .table-card{background:var(--surface);border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow-x:auto;margin-bottom:20px}
    .table-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
    @media(max-width:768px){
      .admin-shell.active{flex-direction:column}
      .sidebar{position:static;width:100%;flex-direction:row;padding:10px;height:auto;flex-wrap:nowrap;overflow-x:auto}
      .admin-main{margin-left:0}
      .sidebar-logo,.sb-role,.sidebar-bottom{display:none}
      .nav-item{padding:8px 12px;font-size:.78rem;border-left:none;border-bottom:3px solid transparent}
      .nav-item.active{border-left:none;border-bottom-color:var(--primary)}
      .chart-row{grid-template-columns:1fr}
      .driver-form-grid{grid-template-columns:1fr}
      .topbar{flex-direction:column;align-items:flex-start;gap:12px}
      .topbar-right{width:100%;justify-content:space-between}
    }
  </style>

    /* Services Catalog tab */

    .svc-tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px;font-family:'Manrope',sans-serif;font-size:.85rem;font-weight:700;color:var(--text-muted);cursor:pointer}
    .svc-tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}

    .svc-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:16px}

<style id="pz-admin-uat">

<!-- LOGIN SCREEN -->
<div class="admin-login" id="adminLogin">
  <div class="login-card">
    <div class="login-logo"><i data-lucide="package"></i> PackZen <span style="color:var(--text-muted);font-size:.9rem;font-weight:500;">Admin</span></div>
    <p class="login-sub">Restricted — admin access only</p>

    <!-- ✅ FIX: autocomplete off prevents browser from suggesting admin credentials to non-admins -->
    <label class="field-label">Email</label>
    <input id="adminEmail" type="email" class="field-input" placeholder="admin@packzen.com" autocomplete="off">
    <label class="field-label">Password</label>
    <input id="adminPass" type="password" class="field-input" placeholder="Password" autocomplete="off">

    <div id="adminErr" class="auth-err"></div>
    <div class="lockout-banner" id="lockoutBanner"><i data-lucide="lock"></i> Too many failed attempts. Please wait <span id="lockoutTimer">30</span>s before trying again.</div>

    <button class="btn-auth" id="loginBtn" onclick="adminLogin()">Login to Dashboard →</button>
  </div>
</div>

<!-- ✅ FIX 2: Admin shell is EMPTY until auth passes — injected by buildShell() -->
<div class="admin-shell" id="adminShell"></div>

<div class="toast" id="adminToast"></div>

<script>
/* ================================================================
   ✅ SECURITY CONSTANTS
   ================================================================ */
// Must match isAdmin() in firestore.rules (UI gate only — the rules decide).
const ADMIN_EMAILS = [
  "azharahmedm786@gmail.com",
  "azharahmednaz@gmail.com",
  "moveeasyblr@gmail.com"
];

/* ✅ FIX 3: Brute-force rate limiter
   Max 3 failed attempts → 30s lockout, stored in sessionStorage
   so it resets on tab close but persists within the session. */
const RATE_KEY   = "pz_admin_attempts";
const LOCK_KEY   = "pz_admin_lockout";
const MAX_TRIES  = 3;
const LOCKOUT_MS = 30 * 1000; // 30 seconds

function getRateData() {
  try { return JSON.parse(sessionStorage.getItem(RATE_KEY)) || { count: 0 }; } catch(e) { return { count: 0 }; }
}
function setRateData(d) { try { sessionStorage.setItem(RATE_KEY, JSON.stringify(d)); } catch(e) {} }
function getLockout()   { try { return parseInt(sessionStorage.getItem(LOCK_KEY) || "0"); } catch(e) { return 0; } }
function setLockout(ts) { try { sessionStorage.setItem(LOCK_KEY, String(ts)); } catch(e) {} }

function isLockedOut() {
  const until = getLockout();
  return until > Date.now();
}

function recordFailedAttempt() {
  const d = getRateData();
  d.count = (d.count || 0) + 1;
  setRateData(d);
  if (d.count >= MAX_TRIES) {
    setLockout(Date.now() + LOCKOUT_MS);
    setRateData({ count: 0 });
    startLockoutTimer();
  }
}

function clearAttempts() {
  try { sessionStorage.removeItem(RATE_KEY); sessionStorage.removeItem(LOCK_KEY); } catch(e) {}
}

let lockoutInterval = null;
function startLockoutTimer() {
  const banner = document.getElementById("lockoutBanner");
  const span   = document.getElementById("lockoutTimer");
  const btn    = document.getElementById("loginBtn");
  if (banner) banner.style.display = "block";
  if (btn) btn.disabled = true;
  if (lockoutInterval) clearInterval(lockoutInterval);
  lockoutInterval = setInterval(() => {
    const remaining = Math.ceil((getLockout() - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(lockoutInterval);
      if (banner) banner.style.display = "none";
      if (btn) btn.disabled = false;
      return;
    }
    if (span) span.textContent = remaining;
  }, 500);
}

// Resume lockout if page was refreshed during lockout window
if (isLockedOut()) startLockoutTimer();

/* ✅ FIX 4: Session timeout — 2 hours
   Stored in sessionStorage so it resets on tab close. */
const SESSION_KEY      = "pz_admin_session_start";
const SESSION_LIMIT_MS = 2 * 60 * 60 * 1000; // 2 hours
const WARN_BEFORE_MS   = 10 * 60 * 1000;      // warn 10 min before

let sessionInterval = null;

function startSessionTimer() {
  try { sessionStorage.setItem(SESSION_KEY, String(Date.now())); } catch(e) {}
  sessionInterval = setInterval(() => {
    const start = parseInt(sessionStorage.getItem(SESSION_KEY) || "0");
    if (!start) return;
    const elapsed   = Date.now() - start;
    const remaining = SESSION_LIMIT_MS - elapsed;
    const timerEl   = document.getElementById("sessionTimerDisplay");
    if (!timerEl) return;
    if (remaining <= 0) {
      clearInterval(sessionInterval);
      toast("⏱️ Session expired. Signing out for security.");
      setTimeout(() => adminSignOut(), 1500);
      return;
    }
    const mins = Math.floor(remaining / 60000);
    timerEl.textContent = "Session: " + mins + "m";
    timerEl.className   = "session-timer" + (remaining < WARN_BEFORE_MS ? " warn" : "");
  }, 30000);
}

/* ================================================================
   FIREBASE HELPER
   ================================================================ */
function waitFB(cb, n=0) {
  if (window._firebase) { cb(); return; }
  if (n > 30) {
    const err = document.getElementById("adminErr");
    if (err) err.textContent = "Firebase failed to load. Check your connection and refresh.";
    const btn = document.getElementById("loginBtn");
    if (btn) { btn.disabled = false; btn.textContent = "Login to Dashboard →"; }
    return;
  }
  setTimeout(() => waitFB(cb, n+1), 200);
}

/* ================================================================
   AUTO-LOGIN GUARD (checks if already signed in as admin on load)
   ================================================================ */
document.addEventListener("DOMContentLoaded", () => {
  waitFB(() => {
    const { auth, db } = window._firebase;
    auth.onAuthStateChanged(async (user) => {
      if (!user) return; // Not logged in — show login form, nothing else
      const userEmail = (user.email || "").toLowerCase();
      try {
        const snap = await db.collection("users").doc(user.uid).get();
        const data = snap.data() || {};
        if (data.role === "admin" || ADMIN_EMAILS.includes(userEmail)) {
          adminUser = user;
          showShell(data.name || user.displayName || "Admin");
        }
        // If not admin role — do nothing (don't redirect, just show login)
      } catch(e) {
        if (ADMIN_EMAILS.includes(userEmail)) {
          adminUser = user;
          showShell(user.displayName || "Admin");
        }
      }
    });
  });
});

/* ================================================================
   LOGIN — WITH RATE LIMITING
   ================================================================ */
function adminLogin() {
  // ✅ Block if locked out
  if (isLockedOut()) { startLockoutTimer(); return; }

  const email = document.getElementById("adminEmail").value.trim().toLowerCase();
  const pass  = document.getElementById("adminPass").value;
  const err   = document.getElementById("adminErr");
  const btn   = document.getElementById("loginBtn");
  err.textContent = ""; err.style.color = "#ef4444";

  if (!email || !pass) { err.textContent = "Please enter email and password."; return; }

  btn.disabled = true; btn.textContent = "Signing in...";

  waitFB(() => {
    const { auth, db } = window._firebase;
    auth.signInWithEmailAndPassword(email, pass)
      .then(cred => {
        adminUser = cred.user;
        const userEmail = cred.user.email?.toLowerCase() || "";
        db.collection("users").doc(cred.user.uid).get()
          .then(async doc => {
            const role = doc.exists ? doc.data()?.role : null;
            const name = doc.exists ? (doc.data()?.name || "Admin") : "Admin";
            if (role === "admin" || ADMIN_EMAILS.includes(userEmail)) {
              // Auto-fix missing role in Firestore
              if (ADMIN_EMAILS.includes(userEmail) && role !== "admin") {
                try {
                  if (doc.exists) {
                    await db.collection("users").doc(cred.user.uid).update({ role: "admin" });
                  } else {
                    await db.collection("users").doc(cred.user.uid).set({
                      name: cred.user.displayName || "Admin", email: userEmail,
                      role: "admin", createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                  }
                } catch(e) { console.warn("Could not set admin role:", e.message); }
              }
              clearAttempts(); // ✅ Reset attempts on successful login
              showShell(name);
            } else {
              auth.signOut(); adminUser = null;
              recordFailedAttempt(); // ✅ Count as failed — wrong role
              err.textContent = "Access denied. Your account does not have admin permissions.";
            }
          })
          .catch(e => {
            console.error('Admin Auth Firestore Error:', e.code, e.message);
            if (ADMIN_EMAILS.includes(userEmail)) {
              clearAttempts();
              showShell(cred.user.displayName || "Admin");
            } else {
              auth.signOut(); adminUser = null;
              recordFailedAttempt();
              err.textContent = "Could not verify admin role. Please contact support.";
            }
          });
      })
      .catch(e => {
        console.error('Admin Auth Error:', e.code, e.message);
        recordFailedAttempt(); // ✅ Count failed attempt
        const d = getRateData();
        const remaining = MAX_TRIES - d.count;
        if      (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential")
          err.textContent = `Wrong password. ${remaining > 0 ? remaining + " attempt(s) remaining." : ""}`;
        else if (e.code === "auth/user-not-found")
          err.textContent = "No account found with this email.";
        else if (e.code === "auth/invalid-email")
          err.textContent = "Invalid email address.";
        else if (e.code === "auth/too-many-requests")
          err.textContent = "Too many attempts. Please wait a few minutes.";
        else
          err.textContent = e.message;
      })
      .finally(() => { btn.disabled = false; btn.textContent = "Login to Dashboard →"; });
  });
}

/* ================================================================
   SIGN OUT
   ================================================================ */
function adminSignOut() {
  if (sessionInterval) clearInterval(sessionInterval);
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
  waitFB(() => window._firebase.auth.signOut().then(() => {
    // ✅ FIX: Clear the shell HTML on sign out — no admin UI left in DOM
    const shell = document.getElementById("adminShell");
    if (shell) { shell.classList.remove("active"); shell.innerHTML = ""; }
    document.getElementById("adminLogin").style.display = "flex";
    adminUser = null; allBookings=[]; allDrivers=[]; allCustomers=[]; allReviews=[]; allPromos=[];
  }));
}

/* ── ANALYTICS ── */
let analyticsTrendsChart = null, analyticsRoutesChart = null;
function renderAnalytics() {
  const el = id => document.getElementById(id);
  if (!el("analyticsTotalRev")) return;

  // Basic KPIs
  const totalRev = allBookings.reduce((s, b) => s + (b.total || 0), 0);
  const avgVal = allBookings.length ? Math.round(totalRev / allBookings.length) : 0;
  const convRate = allCustomers.length ? ((allBookings.length / allCustomers.length) * 100).toFixed(1) : 0;

  const currentMonth = new Date().getMonth();
  const currentYear = new Date().getFullYear();
  const newCustomersThisMonth = allCustomers.filter(c => {
    const d = c.createdAt?.toDate ? c.createdAt.toDate() : null;
    return d && d.getMonth() === currentMonth && d.getFullYear() === currentYear;
  }).length;

  el("analyticsTotalRev").textContent = "₹" + totalRev.toLocaleString("en-IN");
  el("analyticsAvgValue").textContent = "₹" + avgVal.toLocaleString("en-IN");
  el("analyticsConvRate").textContent = convRate + "%";
  el("analyticsCustGrowth").textContent = "+" + newCustomersThisMonth;

  // Monthly Reports & Trends
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const bByMonth = new Array(12).fill(0), rByMonth = new Array(12).fill(0);
  allBookings.forEach(b => {
    const d = b.createdAt?.toDate ? b.createdAt.toDate() : null;
    if (!d) return;
    bByMonth[d.getMonth()]++;
    rByMonth[d.getMonth()] += Number(b.total) || 0;
  });

  const tbody = el("analyticsMonthlyTable");
  tbody.innerHTML = monthNames.map((m, i) => {
    if (!bByMonth[i] && !rByMonth[i]) return "";
    const avg = bByMonth[i] ? Math.round(rByMonth[i] / bByMonth[i]) : 0;
    return `<tr>
      <td style="font-weight:600">${m}</td>
      <td>${bByMonth[i]}</td>
      <td style="color:#00c96e;font-weight:600">₹${rByMonth[i].toLocaleString("en-IN")}</td>
      <td>₹${avg.toLocaleString("en-IN")}</td>
    </tr>`;
  }).filter(Boolean).join("") || '<tr class="empty-row"><td colspan="4">No data yet</td></tr>';

  // Popular Routes
  const routeCounts = {};
  allBookings.forEach(b => {
    const p = (b.pickup||"").split(",")[0].trim();
    const d = (b.drop||"").split(",")[0].trim();
    if (p && d) {
      const r = p + " → " + d;
      routeCounts[r] = (routeCounts[r] || 0) + 1;
    }
  });
  const sortedRoutes = Object.entries(routeCounts).sort((a,b)=>b[1]-a[1]).slice(0, 5);
  const routeLabels = sortedRoutes.map(x => x[0].length > 15 ? x[0].substring(0, 15) + "..." : x[0]);
  const routeData = sortedRoutes.map(x => x[1]);

  // Charts
  const isDark = document.body.classList.contains("dark");
  const gridColor  = isDark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)";
  const labelColor = isDark ? "#8a9bbf" : "#5a6a8a";
  const commonOpt = { responsive:true, plugins:{ legend:{ display:false } }, scales:{ x:{ grid:{ color:gridColor }, ticks:{ color:labelColor, font:{ size:10 } } }, y:{ grid:{ color:gridColor }, ticks:{ color:labelColor, font:{ size:10 } } } } };

  const ctxT = document.getElementById("analyticsTrendsChart");
  const ctxR = document.getElementById("analyticsRoutesChart");
  if (ctxT && ctxR) {
    if (analyticsTrendsChart) analyticsTrendsChart.destroy();
    if (analyticsRoutesChart) analyticsRoutesChart.destroy();

    analyticsTrendsChart = new Chart(ctxT, {
      type:"line", data:{ labels:monthNames, datasets:[{ label:"Bookings", data:bByMonth, borderColor:"#0057ff", backgroundColor:"rgba(0,87,255,0.1)", fill:true, tension:0.4, borderWidth:2, pointRadius:4 }] },
      options: commonOpt
    });

    analyticsRoutesChart = new Chart(ctxR, {
      type:"bar", data:{ labels:routeLabels, datasets:[{ label:"Bookings", data:routeData, backgroundColor:"#9b72f588", borderColor:"#9b72f5", borderWidth:2, borderRadius:6 }] },
      options: { ...commonOpt, indexAxis: 'y' }
    });
  }
}

/* ── PARCEL MANAGEMENT ── */
let allParcelBookings = [];
function loadParcelBookings() {
  window._firebase.db.collection("parcelBookings").orderBy("createdAt", "desc").get().then(snap => {
    allParcelBookings = [];
    let rev = 0, completed = 0, active = 0;
    snap.forEach(doc => {
      const d = doc.data();
      d.id = doc.id;
      allParcelBookings.push(d);
      if (d.status === 'delivered') { completed++; rev += (d.totalFare || 0); }
      else if (d.status !== 'cancelled') active++;
    });
    document.getElementById("parcelTotalOrders").textContent = allParcelBookings.length;
    document.getElementById("parcelRevenue").textContent = "₹" + rev.toLocaleString('en-IN');
    document.getElementById("parcelCompleted").textContent = completed;
    document.getElementById("parcelActive").textContent = active;
    renderParcelBookings(allParcelBookings);
  });
}
function renderParcelBookings(list) {
  const tb = document.getElementById("parcelTable");
  tb.innerHTML = "";
  if (!list.length) return tb.innerHTML="<tr class='empty-row'><td colspan='7'>No parcel bookings found.</td></tr>";
  list.forEach(raw => {
    const b = escFields(raw);
    const d = b.createdAt ? b.createdAt.toDate().toLocaleDateString('en-IN') : "--";
    const st = b.status || "confirmed";
    const stColor = st==="delivered"?"color:#16a34a":st==="cancelled"?"color:#dc2626":"color:#d97706";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="font-family:'Space Grotesk',sans-serif;font-weight:700;">${b.bookingId||b.id}</td>
      <td><b>${b.customerName||"--"}</b><br><small style="color:var(--text-muted)">${b.customerPhone||"--"}</small></td>
      <td><span class="truncate" style="display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${b.pickupAddress}">${b.pickupAddress||"--"}</span></td>
      <td><span class="truncate" style="display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${b.deliveryAddress}">${b.deliveryAddress||"--"}</span></td>
      <td style="font-weight:700;">₹${Number(raw.totalFare)||0}</td>
      <td style="font-weight:700;text-transform:capitalize;${stColor}">${st}</td>
      <td style="font-size:0.85rem;color:var(--text-muted);">${d}</td>
    `;
    tb.appendChild(tr);
  });
}
function filterParcel(query) {
  query = query.toLowerCase();
  const f = allParcelBookings.filter(b =>
    (b.bookingId&&b.bookingId.toLowerCase().includes(query)) ||
    (b.customerPhone&&b.customerPhone.includes(query)) ||
    (b.customerName&&b.customerName.toLowerCase().includes(query))
  );
  renderParcelBookings(f);
}

/* ── STATS ── */
function updateStats() {
  const el = id => document.getElementById(id);
  if (!el("statToday")) return;
  const today = new Date().toLocaleDateString("en-IN");
  el("statToday").textContent     = allBookings.filter(b => b.date === today).length;
  el("statPending").textContent   = allBookings.filter(b => b.status === "pending").length;
  el("statCancelled").textContent  = allBookings.filter(b => b.status === "cancelled").length;
  el("statDelivered").textContent = allBookings.filter(b => b.status === "delivered").length;

/* Booking filters: status, service type, date range (by moving/service date) and search.
   The summary line shows the revenue for exactly what's filtered. */
function _bType(b) { return b.bookingType === "parcel" || b.flow === "parcel" ? "parcel" : (b.bookingType === "service" || b.flow === "service" || b.serviceId || b.items) ? "service" : "move"; }
function _bDay(b) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(b.date || ""))) return b.date;
  const t = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate() : (b.createdAt ? new Date(b.createdAt) : null);
  return t && !isNaN(t) ? new Date(t.getTime() + 5.5 * 3600e3).toISOString().slice(0, 10) : "";
}
function _num(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function filterBookings(q) {
  q = (q || "").toLowerCase();
  const val = (id, d) => { const el = document.getElementById(id); return el && el.value ? el.value : d; };
  const status = val("filterStatus", "all"), type = val("filterType", "all"), from = val("filterFrom", ""), to = val("filterTo", "");
  filteredBookings = allBookings.filter(b => {
    const matchesSearch = !q || (b.customerName || b.name || "").toLowerCase().includes(q) || (b.id || "").toLowerCase().includes(q) ||
      (b.bookingRef || "").toLowerCase().includes(q) || String(b.phone || "").includes(q);
    const st = b.status === "delivered" ? "completed" : b.status;
    const matchesStatus = status === "all" || b.status === status || st === status;
    const matchesType = type === "all" || _bType(b) === type;
    const day = _bDay(b);
    const matchesDate = (!from || (day && day >= from)) && (!to || (day && day <= to));
    return matchesSearch && matchesStatus && matchesType && matchesDate;
  });
  renderBookingsTable(filteredBookings);
  const live = filteredBookings.filter(b => b.status !== "cancelled");
  const total = live.reduce((t, b) => t + _num(b.total), 0);
  const paid = live.reduce((t, b) => t + _num(b.paid != null ? b.paid : (b.paidAmount != null ? b.paidAmount : b.amountPaid)), 0);
  const done = live.filter(b => ["delivered", "completed"].includes(b.status));
  const doneVal = done.reduce((t, b) => t + _num(b.total), 0);
  const el = document.getElementById("bookingPeriodSummary");
  if (el) el.innerHTML = "<b>" + filteredBookings.length + "</b> bookings" + (from || to ? " (" + (from || "start") + " → " + (to || "today") + ")" : "") +
    " · Booked value <b>₹" + total.toLocaleString("en-IN") + "</b> · Paid online <b>₹" + paid.toLocaleString("en-IN") + "</b>" +
    " · Completed <b>" + done.length + "</b> (₹" + doneVal.toLocaleString("en-IN") + ")" + " · Cancelled " + (filteredBookings.length - live.length);
}
function clearBookingFilters() {
  ["filterFrom", "filterTo", "searchInput"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
  ["filterStatus", "filterType"].forEach(id => { const el = document.getElementById(id); if (el) el.value = "all"; });
  filterBookings("");
}
// "Delivered" can't be written from the browser (firestore.rules). Normally the
// driver completes with the customer's code; this admin-only emergency

function adminEmergencyComplete(id) {

  if (reason.length < 10) { toast("Completion cancelled — a reason of at least 10 characters is required."); return; }
  firebase.app().functions("asia-south1").httpsCallable("adminCompleteBooking")({ bookingId: id, reason })

function updateStatus(id, status) {

/* CSV export of exactly what's filtered. Proper quoting (commas, quotes, new lines),
   UTF-8 BOM so Excel shows ₹ and Indian names correctly, Blob download (works on phones). */
function exportCSV() {
  const list = Array.isArray(filteredBookings) ? filteredBookings : allBookings;
  if (!list || !list.length) { toast("⚠️ No bookings to export for these filters."); return; }
  const headers = ["Booking ref", "Doc ID", "Type", "Customer", "Phone", "Email", "Pickup", "Drop", "Date", "Total (Rs)", "Paid online (Rs)", "Balance (Rs)", "Payment", "Status", "Driver", "Created"];
  const cell = v => { const t = v == null ? "" : String(v); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const created = b => { const t = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate() : null; return t ? t.toISOString().slice(0, 16).replace("T", " ") : ""; };
  const rows = list.map(b => [b.bookingRef || "", b.id || "", _bType(b), b.customerName || b.name || "", b.phone || "", b.email || "",
    b.pickup || b.address || "", b.drop || "", b.date || "", _num(b.total), _num(b.paid != null ? b.paid : (b.paidAmount != null ? b.paidAmount : b.amountPaid)),
    _num(b.balanceDue), b.paymentStatus || b.paymentMode || "", b.status || "", b.driverName || "", created(b)].map(cell).join(","));
  const csv = "\ufeff" + [headers.join(",")].concat(rows).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "PackZen-Bookings-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("📁 Exported " + list.length + " bookings");
}

function escapeHTML(str) {
  if (!str) return "";
  return String(str).replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag]));
}

// Copy of a Firestore record with every string field HTML-escaped, for
// interpolation into markup. Numbers, timestamps and nested objects pass
// through unchanged (nested values must be escaped where they are used).
function escFields(obj) {
  const out = {};
  for (const k in obj) out[k] = typeof obj[k] === "string" ? escapeHTML(obj[k]) : obj[k];
  return out;
}

// Argument for an inline on*="fn(...)" handler. HTML-escaping alone is not
// enough there — the browser decodes entities before running the handler —
// so the value is JSON-quoted first and then HTML-escaped.
function jsArg(v) {
  return escapeHTML(JSON.stringify(String(v ?? "")));
}

// Only inline image data (what the damage-claim form stores) may be used as
// an <img src>.
function safeImageSrc(src) {
  return typeof src === "string" && /^data:image\//i.test(src) ? escapeHTML(src) : "";
}

async function loadCancelRequests() {
  const tbody = document.getElementById("cancelsTable");
  if (!tbody || !window._firebase) return;
  tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;padding:1rem'>Loading...</td></tr>";
  try {
    const db = window._firebase.db;
    const snap = await db.collection("cancelRequests").orderBy("createdAt","desc").limit(50).get();
    if (snap.empty) { tbody.innerHTML = "<tr class='empty-row'><td colspan='6'>No cancellation requests yet.</td></tr>"; return; }
    const ids = [...new Set(snap.docs.map(d => d.data().bookingDocId).filter(Boolean))];
    const bookings = {};
    await Promise.all(ids.map(id => db.collection("bookings").doc(id).get().then(b => { if (b.exists) bookings[id] = b.data(); }).catch(() => {})));
    tbody.innerHTML = snap.docs.map(d => {
      const raw = d.data(), c = escFields(raw), b = bookings[raw.bookingDocId] || {};
      const date = raw.createdAt?.toDate?.().toLocaleDateString("en-IN") || "—";
      const paid = Number(b.paid) || 0, refunded = Number(b.refundedAmount) || 0, pending = Number(b.refundPendingAmount) || 0;
      const canRefund = paid > 0 && /^pay_/.test(String(b.paymentId || "")) && refunded + pending < paid;
      let money = paid ? "Paid online ₹" + paid.toLocaleString("en-IN") : "Not paid online";
      if (refunded) money += " · refunded ₹" + refunded.toLocaleString("en-IN");
      if (pending) money += " · refund pending ₹" + pending.toLocaleString("en-IN");
      const refundBtn = canRefund ? `<button onclick="refundCancelRequest(${jsArg(d.id)}, ${jsArg(raw.bookingDocId)})" style="padding:.3rem .7rem;background:#16a34a;color:white;border:none;border-radius:8px;cursor:pointer;font-size:.75rem;margin-right:6px">💸 Refund ₹${(paid - refunded - pending).toLocaleString("en-IN")}</button>` : "";
      return `<tr>
        <td>${escapeHTML(b.bookingRef || raw.bookingDocId || "—")}<br><small style="color:#6B7D74">${escapeHTML(money)}</small></td><td>${escapeHTML(b.customerName || (raw.customerUid||"").slice(0,8) || "—")}</td>
        <td>${c.reason||"—"}</td><td>${date}</td>
        <td><span style="color:${raw.resolved?'#16a34a':'#dc2626'}">${raw.resolved?"✅ Resolved":"⏳ Pending"}</span></td>
        <td style="white-space:nowrap">${refundBtn}<button onclick="resolveCancelRequest(${jsArg(d.id)})" style="padding:.3rem .7rem;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer;font-size:.75rem">Mark Resolved</button></td>
      </tr>`;
    }).join("");
  } catch(e) { tbody.innerHTML = `<tr><td colspan='6' style='color:red'>Error: ${escapeHTML(e.message)}</td></tr>`; }
}
/* Full refund of what was paid online (policy: cancellations before the day get everything back).
   The server checks the payment belongs to the booking and blocks double / over-refunds. */
async function refundCancelRequest(reqId, bookingId) {
  if (!window._firebase) return;
  const db = window._firebase.db;
  const req = await db.collection("cancelRequests").doc(reqId).get();
  const bk = await db.collection("bookings").doc(bookingId).get();
  if (!bk.exists) { toast("❌ Booking not found"); return; }
  const b = bk.data(), amount = (Number(b.paid) || 0) - (Number(b.refundedAmount) || 0) - (Number(b.refundPendingAmount) || 0);
  if (!(amount > 0)) { toast("Nothing left to refund"); return; }
  if (!confirm(`Refund ₹${amount.toLocaleString("en-IN")} to the customer's original payment method for booking ${b.bookingRef || bookingId}?\n\nRazorpay usually credits it in 5–7 working days.`)) return;
  requireAdmin(async () => {
    try {
      const r = await _adminCallable("adminRefundPayment")({ bookingId, paymentId: b.paymentId, requestId: ("cancel_" + reqId).slice(0, 64),
        reason: "Customer cancellation: " + String((req.exists && req.data().reason) || "cancelled").slice(0, 150), full: true });
      await db.collection("cancelRequests").doc(reqId).update({ resolved: true });
      toast("✅ Refund started" + (r && r.data && r.data.status ? " (" + r.data.status + ")" : "") + " — it appears in Razorpay → Refunds");
      loadCancelRequests();
    } catch (e) { toast("❌ " + (e && e.message ? e.message : "Refund failed")); }
  });
}
async function resolveCancelRequest(docId) {
  if (!window._firebase) return;
  await window._firebase.db.collection("cancelRequests").doc(docId).update({ resolved:true });
  toast("✅ Marked as resolved");
  loadCancelRequests();
}

  const password = (document.getElementById("newDriverPassword")||{}).value||"";
  const msgEl    = document.getElementById("adminDriverMsg");
  const setMsg   = (text, ok) => { if(msgEl){ msgEl.textContent=text; msgEl.style.color=ok?"#16a34a":"#e53e3e"; } };
  if (!name.trim()) return setMsg("⚠️ Please enter the driver's full name.", false);
  if (!email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) return setMsg("⚠️ Please enter a valid email address.", false);
  if (phone.trim() && phone.trim().length!==10) return setMsg("⚠️ Phone must be 10 digits (or leave it blank).", false);
  if (password.length < 6) return setMsg("⚠️ Password must be at least 6 characters.", false);
  setMsg("⏳ Creating driver account...", true);
  const btn = document.querySelector('[onclick="adminCreateDriver()"]');
  if (btn) { btn.disabled=true; btn.textContent="Creating..."; }
  try {
    const { db } = window._firebase;
    const secondaryApp  = firebase.initializeApp(firebase.app().options, "adminDriver_"+Date.now());
    const secondaryAuth = secondaryApp.auth();
    const cred      = await secondaryAuth.createUserWithEmailAndPassword(email.trim(), password);
    const driverUid = cred.user.uid;
    await secondaryAuth.signOut();
    await secondaryApp.delete();
    await db.collection("users").doc(driverUid).set({ name:name.trim(), email:email.trim(), phone:phone.trim()?"+91"+phone.trim():"", vehicle:vehicle||"", role:"driver", isOnline:false, rating:0, totalMoves:0, createdBy:adminUser?adminUser.uid:"admin", createdAt:firebase.firestore.FieldValue.serverTimestamp() });
    try { await _adminCallable("adminUpsertDriverProfile")({ uid: driverUid, profile: { status: "active", vehicleIds: vehicle && PZ_VEHICLES.includes(vehicle) ? [vehicle] : [], skills: ["moving", "packing"], maxJobsPerDay: 3, serviceAreas: ["bangalore"] } }); } catch (e) { console.warn("driver profile", e && e.message); }
    setMsg('✅ Driver "'+name.trim()+'" created and active! They can log in at packzenblr.in/driver.html with this email and password.', true);
    toast("✅ Driver account created for "+name.trim());
    ["newDriverName","newDriverEmail","newDriverPhone","newDriverVehicle","newDriverPassword"].forEach(id=>{const el=document.getElementById(id);if(el)el.value="";});
    loadDrivers();
  } catch(err) {
    if      (err.code==="auth/email-already-in-use") setMsg("⚠️ A driver with this email already exists.", false);
    else if (err.code==="auth/invalid-email")        setMsg("⚠️ Invalid email address format.", false);
    else if (err.code==="auth/weak-password")        setMsg("⚠️ Password is too weak. Use at least 6 characters.", false);
    else setMsg("⚠️ "+(err.message||"Failed to create driver."), false);
  } finally {
    if (btn) { btn.disabled=false; btn.textContent="✅ Create Driver Account"; }
  }
}

<script>
async function downloadInvoice(docId) {
  if (typeof window.jspdf === "undefined") { toast("⚠️ PDF library loading..."); return; }
  if (!window._firebase) { toast("⚠️ Firebase not initialized."); return; }

  let targetId = docId;
  if (!targetId) { toast("⚠️ No booking found."); return; }

  toast("⏳ Generating Invoice...");

  try {
    const docSnap = await window._firebase.db.collection("bookings").doc(targetId).get();
    if (!docSnap.exists) { toast("⚠️ Booking not found."); return; }

    const b = docSnap.data();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const fmt = n => Number(n || 0).toLocaleString("en-IN");
    const safe = str => (str || "—").toString();

    // --- Header ---
    doc.setFillColor(0, 87, 255); // var(--primary)
    doc.rect(0, 0, 210, 40, "F");

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(22);
    doc.setFont("helvetica", "bold");
    doc.text("PackZen", 14, 20);

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("Professional Packers & Movers", 14, 28);

    doc.setFontSize(16);
    doc.setFont("helvetica", "bold");
    doc.text("INVOICE", 160, 22);

    // --- Invoice Info ---
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(10);
    doc.setFont("helvetica", "bold");
    doc.text("Invoice No:", 140, 50);
    doc.setFont("helvetica", "normal");
    doc.text(safe(b.bookingRef), 170, 50);

    doc.setFont("helvetica", "bold");
    doc.text("Invoice Date:", 140, 56);
    doc.setFont("helvetica", "normal");
    const invDate = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().toLocaleDateString("en-IN") : new Date().toLocaleDateString("en-IN");
    doc.text(invDate, 170, 56);

    // --- Customer Details ---
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("Customer Details", 14, 50);

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text(`Name: ${safe(b.customerName)}`, 14, 56);
    doc.text(`Phone: ${safe(b.phone)}`, 14, 62);
    if(b.email) doc.text(`Email: ${safe(b.email)}`, 14, 68);

    // --- Move Details ---
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("Move Details", 14, 80);

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");

    const pickupLines = doc.splitTextToSize(`Pickup: ${safe(b.pickup)}`, 85);
    doc.text(pickupLines, 14, 86);
    let yPos = 86 + (pickupLines.length * 5);

    const dropLines = doc.splitTextToSize(`Drop: ${safe(b.drop)}`, 85);
    doc.text(dropLines, 14, yPos);
    yPos += (dropLines.length * 5);

    doc.text(`Move Date: ${safe(b.date)} ${window.PackZenBookingFormat.timeLabel(b)}`.trim(), 14, yPos);
    doc.text(`Distance: ${b.distance ? b.distance + ' km' : '—'}`, 14, yPos + 6);
    doc.text(`Vehicle: ${safe(window.PackZenBookingFormat.vehicleLabel(b))}`, 14, yPos + 12);

    // Driver Info (Right side)
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("Driver Details", 120, 80);
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text(`Name: ${safe(b.driverName)}`, 120, 86);
    doc.text(`Phone: ${safe(b.driverPhone)}`, 120, 92);

    yPos = yPos + 22;

    // --- Itemized Charges ---
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("Charges Breakdown", 14, yPos);
    yPos += 8;

    // Draw table header
    doc.setFillColor(240, 244, 255);
    doc.rect(14, yPos - 5, 182, 8, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.text("Description", 16, yPos);
    doc.text("Amount (INR)", 160, yPos);
    yPos += 8;

    doc.setFont("helvetica", "normal");

    const bd = b.quoteBreakdown || {};

    const addCharge = (label, amount) => {
      if (amount > 0) {
        doc.text(label, 16, yPos);
        doc.text(`Rs. ${fmt(amount)}`, 160, yPos);
        yPos += 6;
      }
    };

    if (bd.baseFare) addCharge("Base Fare", bd.baseFare);
    else if (b.total) addCharge("Move Charge", b.originalTotal || b.total);

    addCharge("Distance Charge", bd.distanceCharge);
    addCharge("Floor & Handling Charge", bd.floorCharge);
    addCharge("Packing Service", bd.packingCharge);
    addCharge("Furniture & Assembly", bd.furnitureCharge);
    addCharge("Carton Boxes", bd.cartonCharge);

    if (bd.surcharges && bd.surcharges.length > 0) {
       bd.surcharges.forEach(s => addCharge(`Surcharge (${s.label})`, s.amount));
    }

    if (b.promoDiscount > 0 || bd.discount > 0) {
      doc.setTextColor(22, 163, 74); // Green
      addCharge("Discount", -(b.promoDiscount || bd.discount));
      doc.setTextColor(0, 0, 0);
    }

    // Line separator
    yPos += 2;
    doc.setDrawColor(200, 200, 200);
    doc.line(14, yPos, 196, yPos);
    yPos += 6;

    // Total
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("Grand Total:", 120, yPos);
    doc.text(`Rs. ${fmt(b.total)}`, 160, yPos);

    yPos += 15;

    // --- Payment Info ---
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("Payment Details", 14, yPos);
    yPos += 6;
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");

    let paymentMethod = "Pay Later / Cash";
    if (b.paymentType === "full") paymentMethod = "Online (Paid in Full)";
    else if (b.paymentType === "advance") paymentMethod = "Online (Advance Paid)";

    doc.text(`Payment Method: ${paymentMethod}`, 14, yPos);
    const _ps = window.PackZenPaymentState.summarize(b);
    doc.text(`Amount Paid: Rs. ${fmt(_ps.paid || 0)}`, 14, yPos + 6);
    doc.setFont("helvetica", "bold");
    doc.text(_ps.known ? `Balance Due: Rs. ${fmt(_ps.balanceDue)}` : "Balance Due: being confirmed by PackZen", 14, yPos + 12);

    // Items / Furniture Summary (if any)
    yPos += 25;
    if (b.furniture || (b.selectedFurniture && Object.keys(b.selectedFurniture).length > 0)) {
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text("Items Summary", 14, yPos);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);

        // furniture may be a readable string (pay-later/advisor) or an
        // id → qty object (online-paid bookings); never stringify the object.
        const furnText = window.PackZenBookingFormat.itemsSummaryText(b);
        const furnLines = doc.splitTextToSize(furnText, 180);
        const lineH = 4.5, bottom = doc.internal.pageSize.height - 26;
        let y = yPos + 5;
        for (const line of furnLines) {
            if (y > bottom) { doc.addPage(); y = 20; }
            doc.text(line, 14, y);
            y += lineH;
        }
    }

    // --- Footer ---
    const pageHeight = doc.internal.pageSize.height;
    doc.setFillColor(245, 247, 250);
    doc.rect(0, pageHeight - 20, 210, 20, "F");

    doc.setTextColor(100, 100, 100);
    doc.setFontSize(9);
    doc.text("Thank you for choosing PackZen.", 14, pageHeight - 12);
    doc.text("Website: packzenblr.in", 14, pageHeight - 7);
    doc.text("Support: 9945095453", 150, pageHeight - 7);

    doc.save(`PackZen-Invoice-${b.bookingRef || targetId}.pdf`);
    toast("✅ Invoice downloaded successfully!");

  } catch (error) {
    console.error("Error generating invoice:", error);
    toast("❌ Error generating invoice.");
  }
}

async function emailInvoice(docId) {
  if (typeof emailjs === "undefined") { toast("⚠️ Email service not ready."); return; }
  if (!window._firebase) { toast("⚠️ Firebase not initialized."); return; }

  let targetId = docId;
  if (!targetId) { toast("⚠️ No booking found."); return; }

  toast("⏳ Sending Email...");

  try {
    const docSnap = await window._firebase.db.collection("bookings").doc(targetId).get();
    if (!docSnap.exists) { toast("⚠️ Booking not found."); return; }

    const b = docSnap.data();

    let recipientEmail = b.email;
    if (!recipientEmail) {
      // Fallback if no email on booking, try to fetch from user profile
      const userSnap = await window._firebase.db.collection("users").doc(b.customerUid).get();
      if(userSnap.exists && userSnap.data().email) {
        recipientEmail = userSnap.data().email;
      } else {
        toast("⚠️ No email address found for this customer.");
        return;
      }
    }

    emailjs.send("service_surriec", "template_hffggde", {
      booking_id: b.bookingRef || targetId,
      name: b.customerName || "Customer",
      email: recipientEmail,
      phone: b.phone || "—",
      pickup: (b.pickup || "").split(",")[0],
      drop: (b.drop || "").split(",")[0],
      date: b.date || "TBD",
      amount: b.total || 0,
      message: "Your invoice has been generated. You can download the PDF from your PackZen dashboard."
    }).then(() => {
      toast("✅ Invoice emailed successfully!");
    }).catch((err) => {
      console.error("Email failed:", err);
      toast("❌ Failed to send email.");
    });

  } catch (err) {
     console.error("Error fetching for email:", err);
     toast("❌ Error sending email.");
  }
}
</script>





<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();

        // Debounced observer to prevent infinite loops and performance issues
        let timeout;
        const observer = new MutationObserver((mutations) => {
            let shouldUpdate = false;
            for (let m of mutations) {
                if (m.addedNodes.length > 0) {
                    shouldUpdate = true;
                    break;
                }
            }
            if (shouldUpdate) {
                clearTimeout(timeout);
                timeout = setTimeout(() => lucide.createIcons(), 50);
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    }
  });

<script>
/* ── Leads pipeline (lead engine, Level-100 Phase 1) ── */
let _leads = [], _leadsUnsub = null;
const LEAD_STATUSES = ["new","contacted","quoted","booked","lost"];
const LEAD_STATUS_LABEL = { new:"🆕 New", contacted:"📞 Contacted", quoted:"💬 Quoted", booked:"✅ Booked", lost:"✕ Lost" };
function _lesc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function _lago(ms){ if(!ms) return "-"; const m=Math.round((Date.now()-ms)/60000); if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<48) return h+" h ago"; return new Date(ms).toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
function loadLeads(){
  if (_leadsUnsub) return renderLeads();
  _leadsUnsub = window._firebase.db.collection("leads").orderBy("createdAtMs","desc").limit(500).onSnapshot(snap=>{
    _leads = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
    const sel = document.getElementById("leadChannelFilter"), cur = sel.value;
    const chans = [...new Set(_leads.map(l=>l.channel||l.source||"direct"))].sort();
    sel.innerHTML = '<option value="all">All sources</option>' + chans.map(c=>'<option value="'+_lesc(c)+'">'+_lesc(c)+'</option>').join("");
    sel.value = chans.includes(cur) ? cur : "all";
    renderLeads();
  }, err=>{ document.getElementById("leadsTable").innerHTML='<tr class="empty-row"><td colspan="8">Could not load leads: '+_lesc(err.message)+'</td></tr>'; });
}
function renderLeads(){
  const st = document.getElementById("leadStatusFilter").value, ch = document.getElementById("leadChannelFilter").value;
  const q = (document.getElementById("leadSearch").value||"").toLowerCase().trim();
  const rows = _leads.filter(l=>{
    if (st==="open" && !["new","contacted","quoted"].includes(l.status)) return false;
    if (!["open","all"].includes(st) && l.status!==st) return false;
    if (ch!=="all" && (l.channel||l.source||"direct")!==ch) return false;
    if (q && !((l.name||"")+" "+(l.phone||"")+" "+(l.area||"")).toLowerCase().includes(q)) return false;
    return true;
  });
  const newCount = _leads.filter(l=>l.status==="new").length;
  const badge = document.getElementById("leadsNewCount"); if (badge) badge.textContent = newCount ? String(newCount) : "";
  const tb = document.getElementById("leadsTable");
  tb.innerHTML = rows.length ? rows.map(l=>{
    const late = l.status==="new" && (Date.now()-(l.createdAtMs||0)) > 10*60000;
    const wa = "https://wa.me/91"+_lesc(l.phone)+"?text="+encodeURIComponent("Hi "+(l.name||"")+", this is PackZen about your "+(l.serviceLabel||"request")+".");
    return '<tr'+(late?' style="background:#FFF7E6"':'')+'>'+
      '<td title="'+_lesc(new Date(l.createdAtMs||0).toLocaleString("en-IN"))+'">'+_lago(l.createdAtMs)+(late?' <b style="color:#B45309">late</b>':'')+'</td>'+
      '<td><b>'+_lesc(l.name)+'</b><br><a href="tel:'+_lesc(l.phone)+'">'+_lesc(l.phone)+'</a></td>'+
      '<td>'+_lesc(l.serviceLabel||l.service||"-")+'</td>'+
      '<td>'+_lesc(l.area||"-")+(l.inServiceArea===false?' <span style="color:#B42318">(outside area)</span>':'')+'<br><small>'+_lesc(l.date||"")+'</small></td>'+
      '<td>'+_lesc(l.channel||l.source||"direct")+'</td>'+
      '<td><select onchange="setLeadStatus(\''+l.id+'\',this.value)">'+LEAD_STATUSES.map(s=>'<option value="'+s+'"'+(s===l.status?' selected':'')+'>'+LEAD_STATUS_LABEL[s]+'</option>').join("")+'</select>'+(l.bookingRef?'<br><small>'+_lesc(l.bookingRef)+'</small>':'')+'</td>'+
      '<td style="max-width:240px;white-space:pre-wrap"><small>'+_lesc(l.notes||"")+'</small></td>'+
      '<td style="white-space:nowrap"><a class="btn-primary-sm" href="tel:'+_lesc(l.phone)+'" onclick="setLeadStatus(\''+l.id+'\',\'contacted\',true)">Call</a> '+
        '<a class="btn-primary-sm" target="_blank" rel="noopener" href="'+wa+'">WhatsApp</a> '+
        '<button class="btn-primary-sm" onclick="addLeadNote(\''+l.id+'\')">Note</button></td></tr>';
  }).join("") : '<tr class="empty-row"><td colspan="8">No leads here yet.</td></tr>';
  renderLeadKpis();
}
function renderLeadKpis(){
  const since = Date.now()-30*86400e3, recent = _leads.filter(l=>(l.createdAtMs||0)>=since);
  const booked = recent.filter(l=>l.status==="booked");
  const conv = recent.length ? Math.round(booked.length*100/recent.length) : 0;
  const value = booked.reduce((s,l)=>s+(Number(l.bookedValue)||0),0);
  const open = _leads.filter(l=>["new","contacted","quoted"].includes(l.status)).length;
  const late = _leads.filter(l=>l.status==="new" && Date.now()-(l.createdAtMs||0)>10*60000).length;
  document.getElementById("leadKpis").innerHTML = [["Leads (30 days)",recent.length],["Open now",open],["Waiting > 10 min",late],["Booked (30 days)",booked.length],["Conversion",conv+"%"],["Booked value","₹"+value.toLocaleString("en-IN")]]
    .map(k=>'<div class="lead-kpi"><div class="lead-kpi-v">'+k[1]+'</div><div class="lead-kpi-l">'+k[0]+'</div></div>').join("");
  const by = {};
  recent.forEach(l=>{ const c=l.channel||l.source||"direct"; by[c]=by[c]||{n:0,b:0,v:0}; by[c].n++; if(l.status==="booked"){ by[c].b++; by[c].v+=Number(l.bookedValue)||0; } });
  document.getElementById("leadSourceTable").innerHTML = Object.keys(by).sort((a,b)=>by[b].n-by[a].n).map(c=>'<tr><td>'+_lesc(c)+'</td><td>'+by[c].n+'</td><td>'+by[c].b+'</td><td>'+Math.round(by[c].b*100/by[c].n)+'%</td><td>₹'+by[c].v.toLocaleString("en-IN")+'</td></tr>').join("") || '<tr class="empty-row"><td colspan="5">No leads in the last 30 days.</td></tr>';
}
function setLeadStatus(id, status, onlyIfNew){
  const l = _leads.find(x=>x.id===id); if (!l) return;
  if (onlyIfNew && l.status!=="new") return;
  let extra = {};
  if (status==="lost"){ const why = prompt("Why was this lead lost? (price, date, no answer, went elsewhere…)",""); if (why===null){ renderLeads(); return; } extra.lostReason = why.slice(0,200); }
  requireAdmin(()=>window._firebase.db.collection("leads").doc(id).update(Object.assign({ status, updatedAtMs: Date.now(),
    history: firebase.firestore.FieldValue.arrayUnion({ at: Date.now(), status, by: (window._firebase.auth.currentUser||{}).email||"admin" }) }, extra))
    .then(()=>toast("Lead → "+(LEAD_STATUS_LABEL[status]||status))).catch(e=>toast("❌ "+e.message)));
}
function addLeadNote(id){
  const l = _leads.find(x=>x.id===id); if (!l) return;
  const note = prompt("Add a note for "+(l.name||"this lead"),""); if (!note) return;
  const stamp = new Date().toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  requireAdmin(()=>window._firebase.db.collection("leads").doc(id).update({ notes: ((l.notes?l.notes+"\n":"")+"["+stamp+"] "+note).slice(-3000), updatedAtMs: Date.now() })
    .then(()=>toast("📝 Note saved")).catch(e=>toast("❌ "+e.message)));
}
</script>

<script>
/* ── Operations board: moves, parcels and home services together ── */
let _ops = [], _opsUnsub = null, _opsView = "board";
const OPS_COLS = [
  { id: "new", title: "New", hint: "Needs a worker", match: b => ["pending","confirmed"].includes(b.status) && !b.driverUid },
  { id: "assigned", title: "Assigned", hint: "Worker ready", match: b => (b.status === "assigned") || (b.status === "confirmed" && !!b.driverUid) },
  { id: "active", title: "In progress", hint: "Packing / on the way", match: b => ["packing","transit"].includes(b.status) },
  { id: "done", title: "Done", hint: "Completed", match: b => ["delivered","completed"].includes(b.status) },
];
const OPS_TYPE = b => b.bookingType === "parcel" ? "parcel" : b.bookingType === "service" ? "service" : "move";
const OPS_TYPE_LABEL = { move: "Move", parcel: "Parcel", service: "Service" };
function _oesc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function _oday(offset){ const d = new Date(Date.now() + 5.5*3600e3 + offset*86400e3); return d.toISOString().slice(0,10); }
function _orup(n){ const v = Number(n)||0; return "₹" + Math.round(v).toLocaleString("en-IN"); }
function loadOps(){
  if (_opsUnsub) return opsRender();
  _opsUnsub = window._firebase.db.collection("bookings").where("date", ">=", _oday(-7)).orderBy("date").limit(600).onSnapshot(snap => {
    _ops = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    const sel = document.getElementById("opsRider"), cur = sel.value;
    const riders = [...new Map(_ops.filter(b => b.driverUid).map(b => [b.driverUid, b.driverName || b.driverUid])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1])));
    sel.innerHTML = '<option value="all">All riders</option><option value="none">Unassigned</option>' + riders.map(([u,n]) => '<option value="'+_oesc(u)+'">'+_oesc(n)+'</option>').join("");
    sel.value = [...sel.options].some(o => o.value === cur) ? cur : "all";
    opsRender();
  }, err => { document.getElementById("opsBoard").innerHTML = '<div class="empty-td" style="padding:20px">Could not load bookings: '+_oesc(err.message)+'</div>'; });
}
function opsSetView(v, btn){
  _opsView = v;
  document.querySelectorAll(".ops-segbtn").forEach(b => b.classList.toggle("active", b === btn));
  document.getElementById("opsBoard").hidden = v !== "board";
  document.getElementById("opsCalendar").hidden = v !== "calendar";
  opsRender();
}
function _opsFiltered(){
  const range = document.getElementById("opsRange").value, type = document.getElementById("opsType").value;
  const rider = document.getElementById("opsRider").value, q = (document.getElementById("opsSearch").value||"").toLowerCase().trim();
  const showCancelled = document.getElementById("opsShowCancelled").checked;
  const t0 = _oday(0), t1 = _oday(1), t7 = _oday(7), p7 = _oday(-7);
  return _ops.filter(b => {
    const d = b.date || "";
    if (range === "today" && d !== t0) return false;
    if (range === "tomorrow" && d !== t1) return false;
    if (range === "week" && !(d >= t0 && d < t7)) return false;
    if (range === "all" && d < t0) return false;
    if (range === "past" && !(d >= p7 && d < t0)) return false;
    if (type !== "all" && OPS_TYPE(b) !== type) return false;
    if (rider === "none" && b.driverUid) return false;
    if (!["all","none"].includes(rider) && b.driverUid !== rider) return false;
    if (!showCancelled && b.status === "cancelled") return false;
    if (q && !((b.customerName||"")+" "+(b.phone||"")+" "+(b.pickup||"")+" "+(b.drop||"")+" "+(b.bookingRef||"")).toLowerCase().includes(q)) return false;
    return true;
  });
}
function _opsCard(b){
  const t = OPS_TYPE(b);
  const what = t === "service" ? ((b.items||[]).map(i=>i&&i.name).filter(Boolean).slice(0,2).join(", ") || "Service") : t === "parcel" ? "Parcel → " + ((b.drop||"").split(",")[0]) : ((b.pickup||"").split(",")[0] + " → " + (b.drop||"").split(",")[0]);
  const due = Number(b.balanceDue)||0;
  return '<div class="ops-card ops-'+t+'">'+
    '<div class="ops-card-top"><span class="ops-tag ops-tag-'+t+'">'+OPS_TYPE_LABEL[t]+'</span><span class="ops-when">'+_oesc((b.date||"").slice(5))+' · '+_oesc(b.shiftTimeLabel||b.timeSlotLabel||b.shiftTime||b.timeSlot||"")+'</span></div>'+
    '<div class="ops-what">'+_oesc(what)+'</div>'+
    '<div class="ops-who">'+_oesc(b.customerName||"-")+' · <a href="tel:'+_oesc(b.phone)+'">'+_oesc(b.phone||"")+'</a></div>'+
    '<div class="ops-meta">'+_oesc(b.bookingRef||b.id)+' · '+_orup(b.total)+(due>0?' · <b class="ops-due">'+_orup(due)+' due</b>':'')+(b.driverName?' · 🧑‍🔧 '+_oesc(b.driverName):'')+'</div>'+
    '<div class="ops-actions">'+
      (b.status !== "cancelled" && !["delivered","completed"].includes(b.status) ? '<button class="btn-primary-sm" onclick="openAssignModal(\''+b.id+'\')">'+(b.driverUid?'Reassign':'Assign')+'</button>' : '')+
      (["delivered","completed"].includes(b.status) && b.driverUid ? '<button class="btn-export" onclick="opsRecordPayout(\''+b.id+'\')">'+(Number(b.riderPaidAmount)>0?'Paid ₹'+Number(b.riderPaidAmount).toLocaleString("en-IN"):'Record payout')+'</button>' : '')+
      '<select onchange="updateStatus(\''+b.id+'\',this.value)">'+["confirmed","assigned","packing","transit","delivered","cancelled"].map(s=>'<option value="'+s+'"'+(b.status===s?' selected':'')+'>'+s+'</option>').join("")+'</select>'+
    '</div></div>';
}
// Rider payout = 90% of the job value, minus cash the rider already collected.
function opsRecordPayout(id){
  const b = _ops.find(x=>x.id===id); if (!b) return;
  const share = Math.round((Number(b.total)||0)*0.9), cash = Number(b.cashCollected)||0, already = Number(b.riderPaidAmount)||0;
  const suggested = Math.max(0, share - cash - already);
  const v = prompt("Payout to "+(b.driverName||"rider")+" for "+(b.bookingRef||id)+"\nShare ₹"+share+" − cash held ₹"+cash+" − already paid ₹"+already+"\nAmount paid now (₹):", String(suggested));
  if (v===null) return; const amt = Math.round(Number(v)); if (!(amt>=0)) { toast("Enter a valid amount"); return; }
  requireAdmin(()=>window._firebase.db.collection("bookings").doc(id).update({ riderPaidAmount: already+amt, riderPaidAt: Date.now() })
    .then(()=>toast("✅ Payout recorded")).catch(e=>toast("❌ "+e.message)));
}
function opsRender(){
  if (!document.getElementById("opsBoard")) return;
  const rows = _opsFiltered();
  // money strip for the filtered set
  const live = rows.filter(b => b.status !== "cancelled");
  const value = live.reduce((s,b)=>s+(Number(b.total)||0),0), paid = live.reduce((s,b)=>s+(Number(b.paid)||0),0);
  const due = live.reduce((s,b)=>s+(Number(b.balanceDue)||0),0), refundsPending = rows.reduce((s,b)=>s+(Number(b.refundPendingAmount)||0),0);
  const unassigned = live.filter(b => !b.driverUid && !["delivered","completed"].includes(b.status)).length;
  document.getElementById("opsMoney").innerHTML = [["Jobs",live.length],["Unassigned",unassigned],["Booked value",_orup(value)],["Collected",_orup(paid)],["Balance due",_orup(due)],["Refunds pending",_orup(refundsPending)]]
    .map(k=>'<div class="lead-kpi"><div class="lead-kpi-v">'+k[1]+'</div><div class="lead-kpi-l">'+k[0]+'</div></div>').join("");
  if (_opsView === "board") {
    const cancelled = rows.filter(b => b.status === "cancelled");
    const cols = OPS_COLS.map(c => ({ c, list: rows.filter(c.match).sort((a,b)=>String(a.date+(a.shiftTime||"")).localeCompare(String(b.date+(b.shiftTime||"")))) }));
    if (cancelled.length) cols.push({ c: { id: "cancelled", title: "Cancelled", hint: "" }, list: cancelled });
    document.getElementById("opsBoard").innerHTML = cols.map(({c,list}) =>
      '<div class="ops-col"><div class="ops-col-h"><b>'+c.title+'</b> <span class="svc-count">'+list.length+'</span><small>'+c.hint+'</small></div>'+
      (list.length ? list.map(_opsCard).join("") : '<div class="ops-empty">Nothing here</div>')+'</div>').join("");
  } else {
    const days = [...new Set(rows.map(b=>b.date).filter(Boolean))].sort();
    const slotOf = b => { const s = String(b.shiftTime||b.timeSlot||"").toLowerCase(); return /morn|^0?[6-9]|^1[01]/.test(s) ? "Morning" : /after|^1[2-5]/.test(s) ? "Afternoon" : /even|night|^1[6-9]|^2/.test(s) ? "Evening" : "Any time"; };
    const slots = ["Morning","Afternoon","Evening","Any time"];
    document.getElementById("opsCalendar").innerHTML = days.length ? '<div class="ops-cal-grid" style="grid-template-columns:110px repeat('+days.length+',minmax(180px,1fr))"><div></div>'+
      days.map(d=>'<div class="ops-cal-h">'+new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})+' <span class="svc-count">'+rows.filter(b=>b.date===d).length+'</span></div>').join("")+
      slots.map(sl => '<div class="ops-cal-slot">'+sl+'</div>'+days.map(d => { const l = rows.filter(b=>b.date===d && slotOf(b)===sl); return '<div class="ops-cal-cell'+(l.length>3?' ops-busy':'')+'">'+l.map(_opsCard).join("")+'</div>'; }).join("")).join("")+'</div>'
      : '<div class="ops-empty" style="padding:24px">No bookings in this range.</div>';
  }
}
</script>
