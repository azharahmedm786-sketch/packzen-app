<script>
/* ── Partner applications: approve → working crew member (role driver + active profile) ── */
let _partners = [], _partnersUnsub = null;
function _pesc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function loadPartners(){
  if (_partnersUnsub) return renderPartners();
  _partnersUnsub = window._firebase.db.collection("partners").limit(300).onSnapshot(snap => {
    _partners = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
      .sort((a,b) => ((b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0)));
    const pend = _partners.filter(p => (p.verificationStatus||"pending") === "pending").length;
    const el = document.getElementById("partnersPendingCount"); if (el) el.textContent = pend ? String(pend) : "";
    renderPartners();
  }, err => { document.getElementById("partnersList").innerHTML = '<div class="empty-td">Could not load partners: '+_pesc(err.message)+'</div>'; });
}
function renderPartners(){
  const f = document.getElementById("partnerFilter").value;
  const tr = (document.getElementById("partnerTrack")||{}).value || "all";
  const list = _partners.filter(p => (f === "all" || (p.verificationStatus||"pending") === f) && (tr === "all" || (p.partnerCategory||"movers") === tr));
  const docLink = (u, l) => u ? '<a href="'+_pesc(u)+'" target="_blank" rel="noopener" class="btn-export" style="padding:4px 10px">'+l+'</a>' : '<span style="color:#B42318;font-size:.8rem">no '+l+'</span>';
  document.getElementById("partnersList").innerHTML = list.length ? list.map(p => {
    const d = p.documents || {}, st = p.verificationStatus || "pending";
    const when = p.createdAt && p.createdAt.toDate ? p.createdAt.toDate().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "";
    return '<div class="ops-card" style="border-left-color:'+(st==="approved"?"#1F9D5C":st==="rejected"?"#B42318":"#FFB224")+';margin-bottom:10px">'+
      '<div class="ops-card-top"><b style="font-size:1rem">'+_pesc(p.ownerName||"-")+' · '+_pesc(p.businessName||"")+'</b><span><span class="ops-tag ops-tag-service">'+_pesc({movers:"Movers",ac:"AC",handyman:"Handyman",parcel:"Parcel",vehicle:"Vehicles"}[p.partnerCategory||"movers"]||p.partnerCategory)+'</span> <span class="ops-tag">'+_pesc(st)+'</span></span></div>'+
      '<div class="ops-who">'+_pesc(p.businessTypeLabel||p.businessType||"")+' · '+_pesc(p.vehicleTypeLabel||p.vehicleType||"no vehicle")+(p.vehicleRegNo?' ('+_pesc(p.vehicleRegNo)+')':'')+'</div>'+
      '<div class="ops-who"><a href="tel:'+_pesc(String(p.ownerPhone||"").replace(/^\+91/,""))+'">'+_pesc(p.ownerPhone||"")+'</a> · '+_pesc(p.email||"")+' · applied '+when+'</div>'+
      '<div class="ops-meta">Skills: '+_pesc((p.skills||[]).join(", ")||"(not given — set from business type)")+' · Areas: '+_pesc((p.serviceAreas||[]).join(", ")||"-")+' · PAN '+_pesc(p.panNumber||"-")+' · Aadhaar ••••'+_pesc(p.aadhaarLast4||"")+'</div>'+
      '<div class="ops-actions">'+docLink(d.aadhaar,"Aadhaar")+docLink(d.pan,"PAN")+docLink(d.vehicleRc,"RC")+docLink(d.insurance,"Insurance")+docLink(d.profilePhoto,"Photo")+'</div>'+
      (p.rejectionReason && st==="rejected" ? '<div class="ops-meta" style="color:#B42318">Rejected: '+_pesc(p.rejectionReason)+'</div>' : '')+
      '<div class="ops-actions">'+(st!=="approved"?'<button class="btn-primary-sm" onclick="reviewPartner(\''+p.id+'\',\'approve\')">Approve</button>':'')+
        (st!=="rejected"?'<button class="btn-export" onclick="reviewPartner(\''+p.id+'\',\'reject\')">Reject</button>':'')+'</div></div>';
  }).join("") : '<div class="empty-td">No applications here.</div>';
}
function reviewPartner(uid, decision){
  const p = _partners.find(x => x.id === uid); if (!p) return;
  let reason = "";
  if (decision === "reject") { reason = prompt("Reason for rejecting "+(p.ownerName||"this partner")+" (they will see it):", "Documents unclear — please re-upload"); if (reason === null) return; }
  else if (!confirm("Approve "+(p.ownerName||"this partner")+"? They become an active crew member and can receive job offers.")) return;
  requireAdmin(() => _adminCallable("adminReviewPartner")({ uid, decision, reason })
    .then(r => toast(decision === "approve" ? "✅ Approved — skills: "+((r.data.profile||{}).skills||[]).join(", ") : "Rejected"))
    .catch(e => toast("❌ "+(e.message||e))));
}
</script>

<script>
/* ── Team: staff logins (owner only, via adminManageStaff) ── */
function _tesc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function _team(data){ return _adminCallable("adminManageStaff")(data).then(r=>r.data); }
function _shareLink(name, phone, link){
  const msg = "Hi " + name + ", welcome to the PackZen team! Set your password here (link works once): " + link + "\nThen sign in at https://packzenblr.in/advisor.html and https://packzenblr.in/leads-app/";
  return '<div style="background:#EEF8F2;border:1px solid #BFE3CC;border-radius:12px;padding:10px 12px;font-size:.88rem">✅ Account ready. Share this <b>one-time set-password link</b> with ' + _tesc(name) + ' privately:<br><code style="word-break:break-all">' + _tesc(link) + '</code><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn-export" onclick="navigator.clipboard.writeText(' + _tesc(JSON.stringify(link)) + ').then(()=>toast(\'Link copied\'))">Copy link</button>' +
    (phone ? '<a class="btn-assign" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/91' + _tesc(phone) + '?text=' + encodeURIComponent(msg) + '">Send on WhatsApp</a>' : '') + '</div></div>';
}
function teamCreate(){
  const name=document.getElementById("stName").value.trim(), email=document.getElementById("stEmail").value.trim(), phone=document.getElementById("stPhone").value.replace(/\D/g,"").slice(-10), role=document.getElementById("stRole").value;
  const out=document.getElementById("stResult"); out.innerHTML='<span style="color:#6B7D74">Creating…</span>';
  requireAdmin(()=>_team({op:"create",name,email,phone,role}).then(r=>{ out.innerHTML=_shareLink(name,phone,r.setPasswordLink); ["stName","stEmail","stPhone"].forEach(i=>document.getElementById(i).value=""); loadTeam(); })
    .catch(e=>{ out.innerHTML='<span style="color:#B42318">❌ '+_tesc(e.message)+'</span>'; }));
}
function loadTeam(){
  const box=document.getElementById("teamList");
  requireAdmin(()=>_team({op:"list"}).then(r=>{
    box.innerHTML = r.staff.length ? '<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody>' + r.staff.map(m=>
      '<tr><td>'+_tesc(m.name)+'</td><td>'+_tesc(m.email)+'</td><td>'+(m.disabled?'<span style="color:#B42318">Disabled</span>':
        '<select onchange="teamAct(\''+m.uid+'\',\'setRole\',this.value)"><option value="advisor"'+(m.role==="advisor"?" selected":"")+'>Sales &amp; support</option><option value="manager"'+(m.role==="manager"?" selected":"")+'>Operations manager</option></select>')+'</td>'+
      '<td style="white-space:nowrap">'+(m.disabled?'<button class="btn-export" onclick="teamAct(\''+m.uid+'\',\'enable\')">Re-enable</button>':
        '<button class="btn-export" onclick="teamAct(\''+m.uid+'\',\'resetLink\',null,\''+_tesc(m.name)+'\',\''+_tesc(m.phone)+'\')">New password link</button> <button class="btn-export" onclick="teamAct(\''+m.uid+'\',\'disable\')">Remove access</button>')+'</td></tr>').join("") + '</tbody></table>'
      : '<div class="empty-td">No team members yet. Add your first one above.</div>';
  }).catch(e=>{ box.innerHTML='<div class="empty-td">Could not load team: '+_tesc(e.message)+'</div>'; }));
}
function teamAct(uid, op, role, name, phone){
  if (op==="disable" && !confirm("Remove this person's access? They are signed out everywhere.")) return;
  requireAdmin(()=>_team({op,uid,role}).then(r=>{ if (op==="resetLink") document.getElementById("stResult").innerHTML=_shareLink(name||"",phone||"",r.setPasswordLink); else toast("✅ Saved"); loadTeam(); })
    .catch(e=>toast("❌ "+e.message)));
}
</script>

<script>
/* ── Business readiness: active crews, technicians, packing stock, lead response ── */
const PZ_STOCK = [["boxes","Cartons / boxes",40],["tape","Tape rolls",10],["bubble","Bubble wrap (rolls)",4],["stretch","Stretch film (rolls)",4],["blankets","Moving blankets",10],["crates","Wooden crates",0]];
function _esc2(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function loadReadiness() {
  if (!window._firebase || !document.getElementById("readinessCard")) return;
  const db = window._firebase.db, chip = (ok, t) => '<span class="badge ' + (ok ? 'badge-delivered' : 'badge-pending') + '">' + (ok ? '✅ ' : '⚠️ ') + _esc2(t) + '</span>';
  Promise.all([
    db.collection("driverProfiles").where("status","==","active").get().catch(()=>null),
    db.collection("leads").where("status","==","new").limit(200).get().catch(()=>null),
    db.collection("settings").doc("inventory").get().catch(()=>null),
    db.collection("promos").doc("FIRSTMOVE").get().catch(()=>null)
  ]).then(([dp, leads, inv, promo]) => {
    const profiles = dp ? dp.docs.map(d=>d.data()) : [];
    const movers = profiles.filter(p => (p.skills||[]).includes("moving")).length;
    const techs = profiles.filter(p => (p.skills||[]).some(k => k==="ac" || k==="appliances")).length;
    const waiting = leads ? leads.docs.map(d=>d.data()).filter(l => l.tier !== "junk" && Date.now() - (l.createdAtMs||0) > 10*60000).length : 0;
    const items = (inv && inv.exists && inv.data().items) || {};
    const low = PZ_STOCK.filter(([k,,min]) => min > 0 && Number(items[k]||0) < min).map(x=>x[1]);
    document.getElementById("readinessChips").innerHTML =
      chip(movers >= 2, movers + " active moving crew" + (movers===1?"":"s") + (movers < 2 ? " (aim for 2+)" : "")) +
      chip(techs >= 1, techs + " AC / appliance technician" + (techs===1?"":"s")) +
      chip(waiting === 0, waiting ? waiting + " lead(s) waiting > 10 min" : "No leads waiting") +
      chip(!low.length, low.length ? "Low stock: " + low.join(", ") : "Packing stock OK") +
      chip(!!(promo && promo.exists && promo.data().active), "FIRSTMOVE promo " + (promo && promo.exists && promo.data().active ? "active" : "missing"));
    document.getElementById("stockGrid").innerHTML = PZ_STOCK.map(([k,label,min]) => {
      const v = Number(items[k]||0), lowc = min > 0 && v < min;
      return '<label style="display:block;font-size:.85rem;font-weight:600;color:' + (lowc ? '#B42318' : 'inherit') + '">' + _esc2(label) + (min ? ' <small style="font-weight:500;color:#6B7D74">min ' + min + '</small>' : '') +
        '<input type="number" min="0" max="100000" step="1" data-stock="' + k + '" value="' + v + '" style="display:block;width:100%;margin-top:4px;padding:8px;border:1px solid ' + (lowc ? '#F2B8B5' : '#d6e2dc') + ';border-radius:10px;font:inherit"></label>';
    }).join("");
  });
}
function saveStock() {
  const items = {}; document.querySelectorAll("#stockGrid [data-stock]").forEach(i => { items[i.dataset.stock] = Math.max(0, Math.min(100000, Math.round(Number(i.value)||0))); });
  window._firebase.db.collection("settings").doc("inventory").set({ items, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: (window._firebase.auth.currentUser||{}).email || "admin" })
    .then(() => { toast("✅ Stock saved"); loadReadiness(); }).catch(e => toast("❌ " + e.message));
}
(function waitReady(n){ if (window._firebase && window._firebase.auth && window._firebase.auth.currentUser && document.getElementById("readinessCard")) return loadReadiness(); if ((n||0) < 120) setTimeout(() => waitReady((n||0)+1), 1000); })();
</script>
